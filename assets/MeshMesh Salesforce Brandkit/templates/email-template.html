<!DOCTYPE html>
<!--
  MeshMesh × Salesforce — Email Template
  Inline styles only (email-client safe). 600px max width. Dark brand canvas.
  Placeholders: {{subject}} {{preheader}} {{eyebrow}} {{headline}} {{content}}
                {{cta_label}} {{cta_url}} {{footer_note}} {{logo_url}}
  {{logo_url}} = PUBLIC https URL of the white co-branded lockup.
  IMPORTANT: email must use the PNG (…-wordmark-wht.png), NOT the SVG — major email
  clients (Gmail, Outlook) block inline/linked SVG and relative paths. The other
  templates (web/report/artifact) use the crisper SVG; only email stays on raster PNG.
  Host the PNG and swap in its absolute https URL.
-->
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>{{subject}}</title>
</head>
<body style="margin:0; padding:0; background-color:#0A0A0A; -webkit-font-smoothing:antialiased;">
  <div style="display:none; max-height:0; overflow:hidden; opacity:0; color:#0A0A0A;">{{preheader}}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0A0A0A;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:600px; max-width:600px; background-color:#141414; border:1px solid #262626; border-radius:16px; overflow:hidden;">
          <!-- Header -->
          <tr>
            <td style="padding:26px 32px; border-bottom:1px solid #262626;">
              <img src="{{logo_url}}" width="270" alt="MeshMesh from Salesforce" style="display:block; border:0; height:auto;" />
            </td>
          </tr>
          <!-- Body -->
          <tr>
            <td style="padding:40px 32px 8px 32px; font-family:'Geist Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
              <p style="margin:0 0 14px 0; font-size:11px; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; color:#FA6863;">{{eyebrow}}</p>
              <h1 style="margin:0 0 20px 0; font-size:28px; line-height:1.15; font-weight:400; letter-spacing:-0.01em; color:#FFFFFF;">{{headline}}</h1>
              <div style="font-size:16px; line-height:1.65; color:#A1A1A1;">
                {{content}}
              </div>
            </td>
          </tr>
          <!-- CTA -->
          <tr>
            <td style="padding:16px 32px 44px 32px;">
              <table role="presentation" cellpadding="0" cellspacing="0"><tr>
                <td style="border-radius:8px; background-color:#FA6863;">
                  <a href="{{cta_url}}" style="display:inline-block; padding:13px 26px; font-family:'Geist Sans',-apple-system,sans-serif; font-size:15px; font-weight:600; color:#0A0A0A; text-decoration:none; border-radius:8px;">{{cta_label}}</a>
                </td>
              </tr></table>
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="padding:24px 32px; border-top:1px solid #262626; background-color:#0F0F0F; font-family:'Geist Sans',-apple-system,sans-serif; font-size:12px; line-height:1.6; color:#6B6B6B;">
              {{footer_note}}
              <br /><br />
              <span style="color:#6B6B6B;">Salesforce &times; MeshMesh &middot; Internal &middot; Confidential</span>
            </td>
          </tr>
        </table>
        <p style="margin:20px 0 0 0; font-family:'Geist Sans',-apple-system,sans-serif; font-size:11px; color:#3D3D3D;">Prepared by MeshMesh.</p>
      </td>
    </tr>
  </table>
</body>
</html>
