    /* Scrim: darkens the left text zone so white type reads on any colorway. */
    .cover::before{
      content:""; position:absolute; inset:0; z-index:1;
      background:linear-gradient(90deg, rgba(10,10,10,0.74) 0%, rgba(10,10,10,0.40) 40%, rgba(10,10,10,0) 66%);

    p.sub{font-size:clamp(0.95rem,1.5vw,1.15rem);color:var(--mm-muted);max-width:34ch;}
    @media (max-width:640px){ .content .body{max-width:82%;} p.sub{max-width:28ch;} }
  </style>
</head>
<body>
  <!-- Set the background-image on .cover to {{cover_image}} (see options in the header comment). -->
  <div class="cover">
    <div class="content">
      <img class="logo" src="{{logo_url}}" alt="MeshMesh from Salesforce" />
      <div class="body">
        <div class="rule"></div>
        <div class="eyebrow">{{eyebrow}}</div>
        <h1>{{title}}</h1>
        <p class="sub">{{subtitle}}</p>
      </div>
    </div>
  </div>
</body>
</html>
