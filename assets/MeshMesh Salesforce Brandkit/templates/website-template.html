<!DOCTYPE html>
<!--
  MeshMesh × Salesforce — Website / Landing Template
  Responsive. CSS variables (see :root). Branded nav, hero, content, footer.
  Placeholders: {{page_title}} {{nav_cta}} {{hero_eyebrow}} {{hero_headline}}
                {{hero_subhead}} {{cta_label}} {{cta_url}} {{content}} {{year}}
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{page_title}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --mm-primary:#FA6863; --mm-primary-hover:#E5473F; --mm-accent:#3AD598; --mm-amber:#D38C49;
      --mm-bg:#0A0A0A; --mm-surface:#141414; --mm-surface-2:#1C1C1C;
      --mm-fg:#FFFFFF; --mm-muted:#A1A1A1; --mm-subtle:#6B6B6B; --mm-border:#262626;
      --mm-radius:0.475rem; --mm-radius-card:1rem;
      --mm-font:'Geist','Geist Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      --mm-mono:'Geist Mono','SF Mono',Monaco,monospace;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--mm-bg); color:var(--mm-fg); font-family:var(--mm-font); line-height:1.6; -webkit-font-smoothing:antialiased; }
    a { color:inherit; text-decoration:none; }
    .wrap { max-width:1080px; margin:0 auto; padding:0 24px; }
    .eyebrow { font-size:0.75rem; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; color:var(--mm-primary); }

    /* Nav */
    nav { border-bottom:1px solid var(--mm-border); position:sticky; top:0; background:rgba(10,10,10,0.8); backdrop-filter:blur(12px); z-index:10; }
    .nav-inner { display:flex; align-items:center; justify-content:space-between; height:64px; }
    .brand { display:flex; align-items:center; gap:12px; }
    .brand svg { width:26px; height:26px; }
    .brand .lockup { font-size:0.72rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--mm-subtle); }
    .btn { display:inline-block; padding:11px 22px; border-radius:8px; font-weight:600; font-size:0.95rem; transition:.15s; }
    .btn-primary { background:var(--mm-primary); color:#0A0A0A; }
    .btn-primary:hover { background:var(--mm-primary-hover); }
    .btn-ghost { border:1px solid var(--mm-border); color:var(--mm-fg); }
    .btn-ghost:hover { border-color:var(--mm-muted); }

    /* Hero */
    .hero { position:relative; padding:150px 0 120px; overflow:hidden;
      background:#0A0A0A url("../assets/covers/MeshMesh%20Cover%202.webp") right center / cover no-repeat; }
    /* Scrim: darkens the left so headline/subtext read, fades to page ink at the bottom. */
    .hero::before { content:""; position:absolute; inset:0; z-index:0;
      background:
        linear-gradient(90deg, rgba(10,10,10,0.94) 0%, rgba(10,10,10,0.80) 38%, rgba(10,10,10,0.34) 66%, rgba(10,10,10,0.05) 100%),
        linear-gradient(0deg, #0A0A0A 0%, rgba(10,10,10,0) 26%); }
    .hero .wrap { position:relative; z-index:1; }
    .hero h1 { font-size:clamp(2.4rem,6vw,4rem); font-weight:400; letter-spacing:-0.02em; line-height:1.05; margin:18px 0 22px; max-width:16ch; }
    .hero p.sub { font-size:1.15rem; color:var(--mm-muted); max-width:52ch; margin-bottom:32px; }
    .hero-actions { display:flex; gap:14px; flex-wrap:wrap; }

    /* Content */
    .content { padding:72px 0; border-top:1px solid var(--mm-border); }
    .content h2 { font-size:1.9rem; font-weight:500; letter-spacing:-0.01em; margin:0 0 12px; }
    .content p { color:var(--mm-muted); max-width:68ch; margin:0 0 18px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:20px; margin-top:36px; }
    .card { background:var(--mm-surface); border:1px solid var(--mm-border); border-radius:var(--mm-radius-card); padding:28px; }
    .card .stat { font-size:2.4rem; font-weight:400; letter-spacing:-0.01em; }
    .card .stat.pos { color:var(--mm-accent); }
    .card .label { font-size:0.72rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--mm-subtle); margin-top:6px; }
    .card h3 { font-size:1.1rem; font-weight:600; margin:0 0 8px; }
    .card p { font-size:0.95rem; margin:0; }
    .tag { display:inline-block; font-size:0.75rem; color:var(--mm-muted); border:1px solid var(--mm-border); border-radius:9999px; padding:4px 12px; margin:4px 6px 0 0; }

    /* Footer */
    footer { border-top:1px solid var(--mm-border); background:#070707; padding:48px 0; }
    .foot-inner { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; }
    .foot-inner .muted { color:var(--mm-subtle); font-size:0.85rem; }
    @media (max-width:640px){ .hero{padding:84px 0 60px;} .nav-inner .lockup{display:none;} }
  </style>
</head>
